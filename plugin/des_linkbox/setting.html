<@7>
<@local(ps)>
<$ps=argv#0>
	<table class="blog-setting">
	<tbody>
	<tr>
		<th>モジュールタイトル</th>
		<td><input type="text" class="w160" name="title" value="<@ps.title || 'リンク集'>" maxlength="64"></td>
	</tr>
	</tbody>
	</table>

	<p>各要素は個別の「&lt;li&gt;～&lt;/li&gt;」の中に出力されます。
	<table class="blog-setting">
	<thead>
	<tr>
		<th>リンク</th>
		<th>削除</th>
	</tr>
	</thead>
	<tbody id="link-elements">
	</tbody>
	</table>

	<button type="button" id="link-append">リンクの追加</button>

<div style="display: none" id="lkbox-form">
リンク名<br>
<input type="text" class="w200" id="lkbox-link-name"><br>
リンクURL<br>
<input type="text" class="w520" id="lkbox-link-url"><br>
※http, https, mailto。もしくは / から始まるパスのみ使用可能。<br>
※URLを省略した場合、ただのテキストが挿入されます。<br>
※リンクを省略した場合、リンク名はURLと同じになります。<br>
</div>

<div style="display: none" id="lkbox-elemtns">
<@ps.elements>
</div>

<!--JavaScript===============================================================-->
<script>!function(){
var tbody = document.getElementById('link-elements');
var btn   = document.getElementById('link-append');
adiary.sortable([ tbody ]);
var div = document.getElementById('lkbox-form');
div.remove();

btn.addEventListener('click', function(){
	document.getElementById('body').appendChild(div);
	var inp_url  = document.getElementById('lkbox-link-url');
	var inp_text = document.getElementById('lkbox-link-name');
	var buttons = {};
	buttons['OK'] = function(){
		append_element(inp_text.value, inp_url.value);
		adiary.dialog_close(div);
		div.remove();
	};
	buttons[ 'CANCEL' ] = function(){
		adiary.dialog_close(div);
		div.remove();
	};
	inp_url.value  = '';
	inp_text.value = '';

	// ダイアログの表示
	adiary.dialog(div, {
		modal: true,
		width:	adiary.DialogWidth,
		title:  btn.textContent,
		buttons: buttons
	});
});

function hidden(name, value) {
	var inp = document.createElement('input');
	inp.setAttribute('type',  'hidden');
	inp.setAttribute('name',  name);
	inp.setAttribute('value', value);
	return inp;
}
var num=0;
function append_element(text, url) {
	if (text == '') text=url;
	var tr = document.createElement('tr');
	var td = document.createElement('td');
	// リンク
	if (!url || url == '') {
		td.textContent = text;
	} else {
		var a = document.createElement('a');
		a.setAttribute('href', url);
		a.textContent = text;
		td.appendChild( a );
	}
	// 閉じるボタン
	var cl = document.createElement('td');
	cl.className = 'c';
	var span = document.createElement('span');
	span.className = 'ui-icon ui-icon-closethick ui-button';
	span.addEventListener('click', function(){ tr.remove() });
	var inp0 = hidden('url_ary',  num + ',' + url);
	var inp1 = hidden('text_ary', num + ',' + text);
	num++;

	cl.append(inp0, inp1, span);
	tr.append(td, cl);
	tbody.appendChild(tr);
}
/////////////////
//初期化処理
/////////////////
var list = adiary.secure('#lkbox-elemtns').textContent.split("\n");
for(var i=0; i<list.length; i++) {
	var x = list[i].indexOf("\t");
	if (x<0) continue;
	var text = list[i].substr(0,x);
	var url  = list[i].substr(x+1);
	append_element(text,url);
}
///
}()</script>
