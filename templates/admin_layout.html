<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{ title }} - 管理画面 - {{ blog.blog_title }}</title>
<link rel="stylesheet" href="{{ urls.style }}">
</head>
<body class="admin">
<header class="site-header">
  <p class="site-title"><a href="{{ urls.admin }}">管理画面</a></p>
  <p class="site-description"><a href="{{ urls.top }}">{{ blog.blog_title }}</a></p>
  {{# if logged_in }}
  <nav class="admin-nav">
    <a href="{{ urls.admin }}">ダッシュボード</a>
    <a href="{{ urls.articles }}">記事</a>
    <a href="{{ urls.new_article }}">新しい記事</a>
    <a href="{{ urls.tags }}">タグ</a>
    <a href="{{ urls.media }}">メディア</a>
    <a href="{{ urls.comments }}">コメント</a>
    <a href="{{ urls.blog_settings }}">ブログの設定</a>
    <a href="{{ urls.comment_settings }}">コメントの設定</a>
    <a href="{{ urls.editor_settings }}">編集の設定</a>
    <a href="{{ urls.sidebar }}">サイドバー</a>
  </nav>
  <form class="admin-logout" method="post" action="{{ urls.logout }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit">ログアウト</button>
  </form>
  {{/ if }}
</header>
<main class="admin-main">
{{! content は各ページのテンプレートの出力で、エスケープ済み }}
{{ raw content }}
</main>
<script src="{{ urls.admin_script }}" defer></script>
</body>
</html>
