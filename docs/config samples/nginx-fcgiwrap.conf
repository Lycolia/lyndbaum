# conf.d配下にlyndbaum.confなど、適当な名前で配置することを想定している。
# パスなどの値は参考値なので適宜修正すること
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name lyndbaum.example.com;

  ssl_certificate /path/to/fullchain.pem;
  ssl_certificate_key /path/to/privkey.pem;

  client_max_body_size 20M;

  root /var/www/lyndbaum;

  # ブラウザに中身から種類を推測させない（テキストに書いたHTMLをHTMLとして開かせない）
  add_header X-Content-Type-Options nosniff always;

  # 旧システム（adiary）のRSSとサイトマップのURLを転送する
  location ^~ /pub/lycolia/ {
    rewrite ^/pub/lycolia/rss\.xml$ /pub/rss.xml permanent;
    rewrite ^/pub/lycolia/sitemap\.xml$ /pub/sitemap.xml permanent;
    return 404;
  }

  location /pub/ { try_files $uri =404; }

  # 添付ファイルの種類（docs/admin.md の「ファイルのアップロード」）。既定の mime.types に無いことがあるものを決める
  #   テキストは UTF-8 を前提にして charset を付ける（受け付けるときは文字コードを問わない。UTF-8 でなければブラウザでは文字化けする）
  location ~* ^/pub/.+\.(?:txt|md)$ { try_files $uri =404; types {} default_type text/plain; charset utf-8; }
  location ~* ^/pub/.+\.csv$ { try_files $uri =404; types {} default_type text/csv; charset utf-8; charset_types text/csv; }
  location ~* ^/pub/.+\.tsv$ { try_files $uri =404; types {} default_type text/tab-separated-values; charset utf-8; charset_types text/tab-separated-values; }

  # サイトのアイコン。設定の画面で入れたもの（pub/branding/）、無ければ既定のロゴ（Lyndbaum::SiteIcon）
  location = /favicon.ico { try_files /pub/branding/favicon.ico /pub/assets/logo/favicon.ico =404; }

  # try_filesでindex.cgiに移すとnginxがクエリを捨てるので、
  # その場合は「try_files $uri /index.cgi?$args;」のように?$argsを付けること
  location / {
    fastcgi_pass unix:/var/run/fcgiwrap.socket;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.cgi;
    fastcgi_param SCRIPT_NAME "";
    fastcgi_param HTTPS on;
    fastcgi_param SERVER_PORT 443;
  }
}
