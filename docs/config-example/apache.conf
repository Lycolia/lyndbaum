# LyndbaumのApacheの設定の見本（VPSや自宅サーバーでCGIとして動かすとき）
#
# ・mod_cgi（またはmod_cgid）、mod_rewrite、mod_sslが必要。
#   Debian系なら sudo a2enmod cgid rewrite ssl
# ・非公開のフォルダの拒否とURLの転送は、根元の.htaccessで行う（.htaccess.sample）。
#   AllowOverride FileInfoは、それを読むための設定
# ・Optionsに+を付けず、Indexes（フォルダの一覧）を無効にする。
#   一覧を出すと、非公開の記事の添付ファイルの名前も分かる
# ・レンタルサーバーでは、この設定は使わない

<VirtualHost *:443>
  ServerName lyndbaum.example.com
  DocumentRoot /var/www/lyndbaum

  SSLEngine on
  SSLCertificateFile    /etc/letsencrypt/live/lyndbaum.example.com/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/lyndbaum.example.com/privkey.pem

  <Directory /var/www/lyndbaum>
    Options ExecCGI SymLinksIfOwnerMatch
    AddHandler cgi-script .cgi
    AllowOverride FileInfo
    Require all granted
  </Directory>
</VirtualHost>
