# Lyndbaumのnginxの設定の見本
#
# ・nginxは.htaccessを読まないので、非公開のフォルダはlocationで拒否する
# ・フォルダの一覧を出すと、非公開の記事の添付ファイルの名前も分かる。
#   autoindexをonにしない（nginxの既定はoff）

# 配布物（CSS、JS、画像など）のキャッシュの期間。mapはserverの外（httpの中）に書く
# ・Lyndbaumが読み込むCSSとJSには、ファイルの更新日時をクエリ（?数字）に付けている（skel/_frame.htmlなど）。
#   ファイルを更新するとURLが変わるので、1年キャッシュさせてよい
# ・クエリが付かないもの（Prism.jsが後から読む言語のファイルなど）は1日にする
map $args $pub_assets_cache {
    ""      "public, max-age=86400";
    default "public, max-age=31536000, immutable";
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name lyndbaum.example.com;

  ssl_certificate     /etc/letsencrypt/live/lyndbaum.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/lyndbaum.example.com/privkey.pem;

  client_max_body_size 100M;

  root /var/www/lyndbaum;

  # 非公開のフォルダ。公開するのはpub/だけ
  # ・1行目は非公開のフォルダ。末尾の/まで合わせて、フォルダの中だけを拒否する
  # ・2行目は.git/、.htaccessなどのドットで始まるもの
  # ・3行目はlyndbaum.user.cgiなどの設定ファイル
  # ・正規表現のlocationは、location /より先に当たる
  location ~ ^/(?:__cache|data|info|lib|plugin|skel|skel\.local|docs|t)/ { deny all; }
  location ~ /\.  { deny all; }
  location ~ \.cgi$  { deny all; }

  # ^~を付けると、正規表現のlocation（上の/\.など）より先に当たる。
  # サムネイルは.thumbnail/の下にあるので、^~が無いとドットで始まる名前の拒否に当たる
  location ^~ /pub/assets/ {
    add_header Cache-Control $pub_assets_cache;
  }

  # このブログ用に作ったCSS（/pub/custom/）と、プラグインのJSの写し（/pub/plugin/）も、更新日時のクエリを付けて読むので、配布物と同じにする。
  location ^~ /pub/custom/ {
    add_header Cache-Control $pub_assets_cache;
  }
  location ^~ /pub/plugin/ {
    add_header Cache-Control $pub_assets_cache;
  }

  # 画像アルバムのファイルは30日。同じ名前のまま中身を変えたファイル（サムネイルの再生成、上書きのアップロード）は、
  # キャッシュが切れるまで前のものが出ることがある
  # /pub/の直下（rss.xml、sitemap.xml、contents.jsonなど）は、Lyndbaumが中身を書き換えるので付けない
  location ^~ /pub/attachments/ {
    add_header Cache-Control "public, max-age=2592000";
  }

  location / {
    try_files $uri @lyndbaum;
  }

  location @lyndbaum {
    include fastcgi_params;
    fastcgi_pass unix:/var/www/lyndbaum/lyndbaum.sock;
    fastcgi_param Basepath /;
  }
}
