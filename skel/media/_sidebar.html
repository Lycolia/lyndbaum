<!--メディア管理のフォルダtree=======================================-->
<div class="hatena-module system-module side-folder-tree">
<div class="hatena-moduletitle">フォルダ一覧</div>
<div class="hatena-modulebody">
<div class="treebox" id="media-folder-tree" data-url="<@Basepath><@v.pub_dir>images.json" data-url-base="<@Basepath><@v.blogimg_dir()>"></div>
<@ifexec(v.blog_admin, begin)>
<button type="button" id="media-new-folder">フォルダ作成</button>
<button type="button" id="media-reload">リロード</button>
<button type="button" id="media-clear-trashbox">ゴミ箱を空に</button>
<$end>
</div> <!-- hatena-modulebody -->
</div> <!-- hatena-module -->
