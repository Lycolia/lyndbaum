<@7>
<$v.special_sidebar_module = 'media/_sidebar'>

<article class="system" id="album">
<h2 class="dynatree-ico-ef" id="folder-icon-change"><span class="dynatree-icon" id="folder-icon"></span><span id="current-folder">(no load)</span><span id="current-count"></span></h2>
<div class="body">
	<div id="album-header">
		<div>
			<@ifexec(v.blog_admin, begin)>
			<label><input type="checkbox" id="all-select">全選択</label><span class="help-text">クリック：選択 / ダブルクリック：表示 / SHIFT+クリック：範囲選択 / CTRL+クリック：ダウンロード</span>
			<$end>
		</div>
		<div class="view-option">
			<span class="option-item"><input type="search" id="name-filter" placeholder="名前で絞り込み" aria-label="名前で絞り込み"></span>
			<span class="option-item">
			<select id="view-type">
				<option value="thumb">サムネイル</option>
				<option value="name">ファイル名</option>
			</select>
			</span>
			<span class="option-item">ソート
			<select id="sort-type">
				<option value="name">名前</option>
				<option value="date" selected>日付</option>
				<option value="size">サイズ</option>
			</select>
			<select id="sort-rev">
				<option value="0">昇順</option>
				<option value="1" selected>降順</option>
			</select>
			</span>
		</div>
	</div>
<@call('media/_main-view')>
</div>
</article>
